name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix project structure
        run: |
          echo "Membuat struktur Android..."
          mkdir -p app/src/main/java/com/sukabumi/tvlauncher
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/mipmap
          
          # Pindahkan file kt ke tempat yang benar
          mv MainActivity.kt app/src/main/java/com/sukabumi/tvlauncher/ 2>/dev/null || true
          mv LiveScoreManager.kt app/src/main/java/com/sukabumi/tvlauncher/ 2>/dev/null || true
          mv MotivasiRepo app/src/main/java/com/sukabumi/tvlauncher/MotivasiRepo.kt 2>/dev/null || true
          mv Services.kt app/src/main/java/com/sukabumi/tvlauncher/ 2>/dev/null || true
          mv Workers.kt app/src/main/java/com/sukabumi/tvlauncher/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv TUTORIAL app/src/main/TUTORIAL.txt 2>/dev/null || true
          
          # Buat build.gradle root kalau belum ada
          if [ ! -f build.gradle ]; then
          cat > build.gradle <<'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          fi

          if [ ! -f settings.gradle ]; then
            echo 'include ":app"' > settings.gradle
          fi

          # Buat app/build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.sukabumi.tvlauncher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sukabumi.tvlauncher"
                  minSdk 28
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-Sukabumi-Mekkah"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui:1.6.3'
              implementation 'androidx.compose.material3:material3:1.2.1'
              implementation 'androidx.tv:tv-material:1.0.0'
              implementation 'androidx.work:work-runtime-ktx:2.9.0'
              implementation 'com.squareup.retrofit2:retrofit:2.9.0'
              implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # Buat file adzan dummy biar gak error build
          echo "dummy" > app/src/main/res/raw/adzan.mp3 || mkdir -p app/src/main/res/raw && touch app/src/main/res/raw/adzan.mp3
          
          # Buat icon dummy
          touch app/src/main/res/mipmap/ic_launcher.xml || true
          
          ls -R

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SukabumiLauncher-APK
          path: app/build/outputs/apk/debug/*.apk
